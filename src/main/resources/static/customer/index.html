<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1">

    <title>

        GarageOS | Customer Portal

    </title>

    <!-- ==========================================================
         Bootstrap
         ========================================================== -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- ==========================================================
         Bootstrap Icons
         ========================================================== -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
            rel="stylesheet">

    <!-- ==========================================================
         Shared Theme
         ========================================================== -->

    <link
            rel="stylesheet"
            href="../css/variables.css">

    <link
            rel="stylesheet"
            href="../css/app.css">

    <link
            rel="stylesheet"
            href="../css/components.css">

    <!-- ==========================================================
         Customer Portal
         ========================================================== -->

    <link
            rel="stylesheet"
            href="css/customer.css">

    <link
            rel="stylesheet"
            href="css/sidebar.css">

    <link rel="stylesheet" href="css/dashboard.css">

    <link rel="stylesheet" href="css/vehicle.css">

    <link rel="stylesheet" href="css/repair.css">

    <link rel="stylesheet" href="css/estimate.css">

    <link rel="stylesheet" href="css/invoice.css">

    <link rel="stylesheet" href="css/profile.css">

</head>

<body>

<div class="customer-layout">

    <!-- ======================================================
         Sidebar
         ====================================================== -->

    <aside
            id="customerSidebar"
            class="customer-sidebar">

    </aside>

    <!-- ======================================================
         Main Content
         ====================================================== -->

    <main class="customer-main">

        <!-- ==============================================
             Header
             ============================================== -->

        <header class="customer-header">

            <div>

                <h3
                        id="pageTitle">

                    Dashboard

                </h3>

                <small
                        id="pageSubTitle">

                    Welcome to GarageOS Customer Portal

                </small>

            </div>

            <div class="header-right">

                <button
                        class="btn btn-light">

                    <i class="bi bi-bell"></i>

                </button>

                <div class="customer-profile">

                    <div class="profile-avatar">

                        <i class="bi bi-person-circle"></i>

                    </div>

                    <div>

                        <div
                                id="customerName">

                            Customer

                        </div>

                        <small>

                            Vehicle Owner

                        </small>

                    </div>

                </div>

            </div>

        </header>

        <!-- ==============================================
             Dynamic Content
             ============================================== -->

        <section
                id="pageContainer"
                class="page-container">

        </section>

    </main>

</div>

<!-- ==========================================================
     Loading Overlay
     ========================================================== -->

<div
        id="loadingOverlay"
        class="loading-overlay d-none">

    <div class="spinner-border text-primary">

    </div>

</div>

<!-- ==========================================================
     Bootstrap
     ========================================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- ==========================================================
     Shared JS
     ========================================================== -->

<script src="../js/api.js"></script>

<script src="../js/auth.js"></script>

<script src="../js/utils.js"></script>

<script src="../components/modal.js"></script>

<script src="../components/toast.js"></script>

<!-- ==========================================================
     Existing Services
     ========================================================== -->

<script src="../services/customerService.js"></script>

<script src="../services/vehicleService.js"></script>

<script src="../services/invoiceService.js"></script>

<script src="../services/jobCardService.js"></script>

<script src="../services/estimateService.js"></script>

<!-- ==========================================================
     Customer Portal
     ========================================================== -->

<script src="js/dashboard.js"></script>

<script src="js/vehicle.js"></script>

<script src="js/repair.js"></script>

<script src="js/estimate.js"></script>

<script src="js/invoice.js"></script>

<script src="js/profile.js"></script>

<script src="js/sidebar.js"></script>

<script src="services/customerPortalService.js"></script>

<script src="js/router.js"></script>

<script src="js/app.js"></script>

</body>

</html>
