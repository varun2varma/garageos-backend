<div class="container-fluid customer-profile">

    <!-- ==========================================
         Header
         ========================================== -->

    <div class="row mb-4">

        <div class="col-lg-8">

            <h2 class="page-title">

                My Profile

            </h2>

            <p class="page-subtitle">

                View your registered customer information.

            </p>

        </div>

        <div class="col-lg-4 text-lg-end">

            <button
                    id="refreshProfileButton"
                    class="btn btn-primary">

                <i class="bi bi-arrow-clockwise me-2"></i>

                Refresh

            </button>

        </div>

    </div>

    <!-- ==========================================
         Profile Card
         ========================================== -->

    <div class="customer-card mb-4">

        <div class="row align-items-center">

            <div class="col-lg-2 text-center">

                <div class="profile-avatar">

                    <i class="bi bi-person-circle display-1 text-primary"></i>

                </div>

            </div>

            <div class="col-lg-10">

                <h3 id="profileHeadingName">

                    Customer

                </h3>

                <p class="text-muted mb-0">

                    GarageOS Customer Portal

                </p>

            </div>

        </div>

    </div>

    <!-- ==========================================
         Profile Information
         ========================================== -->

    <div id="profileContainer">

        <div class="customer-card">

            <div class="row g-4">

                <div class="col-md-6">

                    <label class="form-label">

                        Full Name

                    </label>

                    <input
                            id="customerName"
                            class="form-control"
                            readonly>

                </div>

                <div class="col-md-6">

                    <label class="form-label">

                        Mobile Number

                    </label>

                    <input
                            id="customerMobile"
                            class="form-control"
                            readonly>

                </div>

                <div class="col-md-6">

                    <label class="form-label">

                        Email Address

                    </label>

                    <input
                            id="customerEmail"
                            class="form-control"
                            readonly>

                </div>

                <div class="col-md-6">

                    <label class="form-label">

                        Customer ID

                    </label>

                    <input
                            id="customerId"
                            class="form-control"
                            readonly>

                </div>

                <div class="col-12">

                    <label class="form-label">

                        Address

                    </label>

                    <textarea
                            id="customerAddress"
                            rows="4"
                            class="form-control"
                            readonly></textarea>

                </div>

            </div>

        </div>

    </div>

</div>
