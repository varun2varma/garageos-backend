<div class="container-fluid">

    <div class="row mb-4">

        <div class="col-md-8">

            <h2 class="page-title">

                My Profile

            </h2>

            <p class="page-subtitle">

                View your account information.

            </p>

        </div>

        <div class="col-md-4 text-end">

            <button
                    id="refreshProfileButton"
                    class="btn btn-primary">

                <i class="bi bi-arrow-clockwise me-2"></i>

                Refresh

            </button>

        </div>

    </div>

    <div class="customer-card">

        <div class="row g-4">

            <div class="col-md-6">

                <label class="form-label">

                    Customer Name

                </label>

                <input
                        id="customerName"
                        class="form-control"
                        readonly>

            </div>

            <div class="col-md-6">

                <label class="form-label">

                    Mobile Number

                </label>

                <input
                        id="customerMobile"
                        class="form-control"
                        readonly>

            </div>

            <div class="col-md-6">

                <label class="form-label">

                    Email

                </label>

                <input
                        id="customerEmail"
                        class="form-control"
                        readonly>

            </div>

            <div class="col-md-6">

                <label class="form-label">

                    GST Number

                </label>

                <input
                        id="customerGst"
                        class="form-control"
                        readonly>

            </div>

            <div class="col-12">

                <label class="form-label">

                    Address

                </label>

                <textarea
                        id="customerAddress"
                        rows="3"
                        class="form-control"
                        readonly></textarea>

            </div>

        </div>

    </div>

</div>
