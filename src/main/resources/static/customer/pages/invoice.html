<div class="container-fluid customer-invoice">

    <!-- ==========================================
         Header
         ========================================== -->

    <div class="row mb-4">

        <div class="col-lg-8">

            <h2 class="page-title">

                My Invoices

            </h2>

            <p class="page-subtitle">

                View your service invoices and payment history.

            </p>

        </div>

        <div class="col-lg-4 text-lg-end">

            <button
                    id="refreshInvoiceButton"
                    class="btn btn-primary">

                <i class="bi bi-arrow-clockwise me-2"></i>

                Refresh

            </button>

        </div>

    </div>

    <!-- ==========================================
         Statistics
         ========================================== -->

    <div class="row g-4 mb-4">

        <div class="col-lg-3 col-md-6">

            <div class="customer-card text-center">

                <i class="bi bi-file-earmark-text display-6 text-primary"></i>

                <h3
                        id="invoiceTotal">

                    0

                </h3>

                <p class="mb-0">

                    Total Invoices

                </p>

            </div>

        </div>

        <div class="col-lg-3 col-md-6">

            <div class="customer-card text-center">

                <i class="bi bi-check-circle-fill display-6 text-success"></i>

                <h3
                        id="invoicePaid">

                    0

                </h3>

                <p class="mb-0">

                    Paid

                </p>

            </div>

        </div>

        <div class="col-lg-3 col-md-6">

            <div class="customer-card text-center">

                <i class="bi bi-hourglass-split display-6 text-warning"></i>

                <h3
                        id="invoicePending">

                    0

                </h3>

                <p class="mb-0">

                    Pending

                </p>

            </div>

        </div>

        <div class="col-lg-3 col-md-6">

            <div class="customer-card text-center">

                <i class="bi bi-cash-stack display-6 text-danger"></i>

                <h3
                        id="invoiceAmount">

                    ₹0

                </h3>

                <p class="mb-0">

                    Total Amount

                </p>

            </div>

        </div>

    </div>

    <!-- ==========================================
         Information Banner
         ========================================== -->

    <div class="customer-card mb-4">

        <div class="row align-items-center">

            <div class="col-lg-10">

                <h4>

                    Service Invoice History

                </h4>

                <p class="text-muted mb-0">

                    All invoices generated by your workshop are listed below.
                    You can track payment status and download invoices once available.

                </p>

            </div>

            <div class="col-lg-2 text-end">

                <i class="bi bi-wallet2 display-4 text-primary"></i>

            </div>

        </div>

    </div>

    <!-- ==========================================
         Invoice Cards
         ========================================== -->

    <div
            id="invoiceContainer"
            class="row g-4">

        <div class="col-12">

            <div class="customer-card text-center py-5">

                <i class="bi bi-file-earmark-text display-3 text-secondary"></i>

                <h4 class="mt-4">

                    Loading Invoices...

                </h4>

            </div>

        </div>

    </div>

</div>
