<div class="container-fluid customer-vehicles">

    <!-- ==========================================
         Header
         ========================================== -->

    <div class="row mb-4">

        <div class="col-lg-8">

            <h2 class="page-title">

                My Garage

            </h2>

            <p class="page-subtitle">

                All vehicles registered with your GarageOS account.

            </p>

        </div>

        <div class="col-lg-4 text-lg-end">

            <button
                    id="refreshVehiclesButton"
                    class="btn btn-primary">

                <i class="bi bi-arrow-clockwise me-2"></i>

                Refresh

            </button>

        </div>

    </div>

    <!-- ==========================================
         Vehicle Statistics
         ========================================== -->

    <div class="row mb-4">

        <div class="col-md-4">

            <div class="customer-card stat-card">

                <div class="stat-icon bg-primary">

                    <i class="bi bi-car-front-fill"></i>

                </div>

                <div class="stat-details">

                    <h3 id="totalVehicleCount">

                        0

                    </h3>

                    <span>

                        Registered Vehicles

                    </span>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="customer-card stat-card">

                <div class="stat-icon bg-success">

                    <i class="bi bi-speedometer2"></i>

                </div>

                <div class="stat-details">

                    <h3 id="petrolVehicleCount">

                        0

                    </h3>

                    <span>

                        Petrol / Diesel

                    </span>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="customer-card stat-card">

                <div class="stat-icon bg-warning">

                    <i class="bi bi-lightning-charge-fill"></i>

                </div>

                <div class="stat-details">

                    <h3 id="electricVehicleCount">

                        0

                    </h3>

                    <span>

                        EV / Hybrid

                    </span>

                </div>

            </div>

        </div>

    </div>

    <!-- ==========================================
         Vehicle Cards
         ========================================== -->

    <div
            id="vehicleGrid"
            class="row g-4">

        <div class="col-12">

            <div class="customer-card text-center p-5">

                <i class="bi bi-car-front display-4 text-secondary"></i>

                <h4 class="mt-3">

                    Loading Vehicles...

                </h4>

            </div>

        </div>

    </div>

</div>
