<div class="container-fluid customer-estimate">

    <!-- ==========================================
         Header
         ========================================== -->

    <div class="row mb-4">

        <div class="col-lg-8">

            <h2 class="page-title">

                Estimate Approval

            </h2>

            <p class="page-subtitle">

                Review every estimate prepared by your service advisor before repair work begins.

            </p>

        </div>

        <div class="col-lg-4 text-lg-end">

            <button
                    id="refreshEstimateButton"
                    class="btn btn-primary">

                <i class="bi bi-arrow-clockwise me-2"></i>

                Refresh

            </button>

        </div>

    </div>

    <!-- ==========================================
         Statistics
         ========================================== -->

    <div class="row g-4 mb-4">

        <div class="col-lg-3 col-md-6">

            <div class="customer-card text-center">

                <i class="bi bi-receipt-cutoff fs-1 text-primary"></i>

                <h3 id="estimateTotal">

                    0

                </h3>

                <p>

                    Total Estimates

                </p>

            </div>

        </div>

        <div class="col-lg-3 col-md-6">

            <div class="customer-card text-center">

                <i class="bi bi-hourglass-split fs-1 text-warning"></i>

                <h3 id="estimatePending">

                    0

                </h3>

                <p>

                    Pending

                </p>

            </div>

        </div>

        <div class="col-lg-3 col-md-6">

            <div class="customer-card text-center">

                <i class="bi bi-check-circle-fill fs-1 text-success"></i>

                <h3 id="estimateApproved">

                    0

                </h3>

                <p>

                    Approved

                </p>

            </div>

        </div>

        <div class="col-lg-3 col-md-6">

            <div class="customer-card text-center">

                <i class="bi bi-x-circle-fill fs-1 text-danger"></i>

                <h3 id="estimateRejected">

                    0

                </h3>

                <p>

                    Rejected

                </p>

            </div>

        </div>

    </div>

    <!-- ==========================================
         Estimate List
         ========================================== -->

    <div
            id="estimateListContainer"
            class="row g-4">

        <div class="col-12">

            <div class="customer-card text-center p-5">

                <div class="spinner-border text-primary mb-3"></div>

                <h5>

                    Loading Estimates...

                </h5>

            </div>

        </div>

    </div>

    <!-- ==========================================
         Estimate Details
         ========================================== -->

    <div
            id="estimateDetailsContainer"
            class="d-none">

        <button
                class="btn btn-outline-primary mb-4"
                onclick="CustomerEstimate.showEstimateList()">

            <i class="bi bi-arrow-left me-2"></i>

            Back to All Estimates

        </button>

        <div
                id="estimateDetailsContent">

        </div>

    </div>

</div>
