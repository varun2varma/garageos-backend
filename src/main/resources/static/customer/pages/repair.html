<div class="container-fluid customer-repair">

    <!-- ==========================================
         Header
         ========================================== -->

    <div class="row mb-4">

        <div class="col-lg-8">

            <h2 class="page-title">
                Repair Tracking
            </h2>

            <p class="page-subtitle">
                Track every stage of your vehicle repair in real time.
            </p>

        </div>

        <div class="col-lg-4 text-lg-end">

            <button
                    id="refreshRepairButton"
                    class="btn btn-primary">

                <i class="bi bi-arrow-clockwise me-2"></i>

                Refresh

            </button>

        </div>

    </div>

    <!-- ==========================================
         Statistics
         ========================================== -->

    <div class="row g-4 mb-4">

        <div class="col-md-3">

            <div class="customer-card text-center">

                <i class="bi bi-clipboard-check fs-1 text-primary"></i>

                <h3
                        id="jobCardCount"
                        class="mt-3">

                    0

                </h3>

                <p class="mb-0">

                    Job Cards

                </p>

            </div>

        </div>

        <div class="col-md-3">

            <div class="customer-card text-center">

                <i class="bi bi-tools fs-1 text-warning"></i>

                <h3
                        id="repairInProgressCount">

                    0

                </h3>

                <p class="mb-0">

                    In Progress

                </p>

            </div>

        </div>

        <div class="col-md-3">

            <div class="customer-card text-center">

                <i class="bi bi-check-circle-fill fs-1 text-success"></i>

                <h3
                        id="completedRepairCount">

                    0

                </h3>

                <p class="mb-0">

                    Delivered

                </p>

            </div>

        </div>

        <div class="col-md-3">

            <div class="customer-card text-center">

                <i class="bi bi-clock-history fs-1 text-danger"></i>

                <h3
                        id="pendingRepairCount">

                    0

                </h3>

                <p class="mb-0">

                    Pending

                </p>

            </div>

        </div>

    </div>

    <!-- ==========================================
         Repair List
         ========================================== -->

    <div
            id="repairListContainer"
            class="row g-4">

        <div class="col-12">

            <div class="customer-card text-center p-5">

                <div class="spinner-border text-primary mb-3"></div>

                <h5>

                    Loading Repairs...

                </h5>

            </div>

        </div>

    </div>

    <!-- ==========================================
         Repair Details
         ========================================== -->

    <div
            id="repairDetailsContainer"
            class="d-none">

        <button
                class="btn btn-outline-primary mb-4"
                onclick="CustomerRepair.showRepairList()">

            <i class="bi bi-arrow-left me-2"></i>

            Back to All Repairs

        </button>

        <div
                id="repairDetailsContent">

        </div>

    </div>

</div>
