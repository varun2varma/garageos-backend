<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1">

    <title>

        GarageOS

    </title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="../auth/login.css">

</head>

<body>

<div class="background"></div>

<div class="login-wrapper">

    <div class="login-card text-center">

        <div class="logo-circle mb-4">

            <i class="bi bi-hourglass-split"></i>

        </div>

        <h2>

            Request Submitted

        </h2>

        <p class="text-muted">

            Your request has been sent to the garage owner.

        </p>

        <p>

            You will be able to access the Employee Portal once your request has been approved.

        </p>

        <button

                class="btn btn-primary"

                onclick="logout()">

            Logout

        </button>

    </div>

</div>

<script src="../js/auth.js"></script>

<script src="pending-approval.js"></script>

</body>

</html>
