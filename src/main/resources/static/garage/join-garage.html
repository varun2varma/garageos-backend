<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1">

    <title>GarageOS | Join Garage</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="../auth/login.css">

    <link
            rel="stylesheet"
            href="join-garage.css">

</head>

<body>

<div class="background"></div>

<div class="login-wrapper">

    <div class="login-card">

        <div class="logo-section">

            <div class="logo-circle">

                <i class="bi bi-buildings-fill"></i>

            </div>

            <h1>

                Join Garage

            </h1>

            <p>

                Enter the garage code shared by your garage owner.

            </p>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Garage Code

            </label>

            <input

                    id="garageCode"

                    class="form-control"

                    maxlength="10"

                    placeholder="Example : G001"

                    autocomplete="off">

        </div>

        <button

                id="joinGarageButton"

                class="btn btn-primary w-100">

            <i class="bi bi-person-plus-fill"></i>

            Join Garage

        </button>

        <div
                id="joinMessage"
                class="mt-3">

        </div>

        <hr>

        <div class="text-center">

            <a
                    href="../onboarding/welcome.html">

                Back

            </a>

        </div>

    </div>

</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>

<script src="garageService.js"></script>

<script src="join-garage.js"></script>

</body>

</html>
