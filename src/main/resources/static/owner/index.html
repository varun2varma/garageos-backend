<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1">

    <title>

        GarageOS | Owner Portal

    </title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="../css/variables.css">

    <link
            rel="stylesheet"
            href="../css/app.css">

    <link
            rel="stylesheet"
            href="../css/components.css">

    <link
            rel="stylesheet"
            href="css/owner.css">

    <link
            rel="stylesheet"
            href="css/sidebar.css">

    <link
            rel="stylesheet"
            href="css/dashboard.css">

    <link
            rel="stylesheet"
            href="css/employees.css">

</head>

<body>

<div class="owner-layout">

    <aside
            id="ownerSidebar"
            class="owner-sidebar">

    </aside>

    <main class="owner-main">

        <header class="owner-header">

            <div>

                <h3 id="pageTitle">

                    Dashboard

                </h3>

                <small id="pageSubTitle">

                    Welcome to GarageOS Owner Portal

                </small>

            </div>

            <div class="header-right">

                <button class="btn btn-light">

                    <i class="bi bi-bell"></i>

                </button>

                <div class="owner-profile">

                    <div class="profile-avatar">

                        <i class="bi bi-person-circle"></i>

                    </div>

                    <div>

                        <div id="ownerName">

                            Owner

                        </div>

                        <small>

                            Garage Owner

                        </small>

                    </div>

                </div>

            </div>

        </header>

        <section
                id="pageContainer"
                class="page-container">

        </section>

    </main>

</div>

<div
        id="loadingOverlay"
        class="loading-overlay d-none">

    <div class="spinner-border text-primary">

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/api.js"></script>

<script src="../js/auth.js"></script>

<script src="../js/utils.js"></script>

<script src="../components/modal.js"></script>

<script src="../components/toast.js"></script>

<script src="../garage/garageService.js"></script>

<script src="services/ownerService.js"></script>

<script src="services/masterService.js"></script>

<script src="js/sidebar.js"></script>

<script src="js/router.js"></script>

<script src="js/app.js"></script>

</body>

</html>
