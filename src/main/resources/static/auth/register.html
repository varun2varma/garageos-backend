<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1">

    <title>GarageOS | Create Account</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
            rel="stylesheet">

    <!-- Register CSS -->
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="register.css">

</head>

<body>

<div class="background"></div>

<div class="login-wrapper">

    <div class="login-card register-card">

        <!-- ===================================================== -->
        <!-- Logo -->
        <!-- ===================================================== -->

        <div class="logo-section">

            <div class="logo-circle">

                <i class="bi bi-car-front-fill"></i>

            </div>

            <h1>GARAGEOS</h1>

            <p>

                Create your GarageOS account

            </p>

        </div>

        <!-- ===================================================== -->
        <!-- Error -->
        <!-- ===================================================== -->

        <div
                id="errorMessage"
                class="alert alert-danger d-none">

        </div>

        <!-- ===================================================== -->
        <!-- Form -->
        <!-- ===================================================== -->

        <form id="registerForm">

            <div class="row">

                <div class="col-md-6 mb-4">

                    <label class="form-label">

                        First Name

                    </label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-person"></i>

                        </span>

                        <input

                                id="firstName"

                                class="form-control"

                                type="text"

                                placeholder="First Name"

                                required>

                    </div>

                </div>

                <div class="col-md-6 mb-4">

                    <label class="form-label">

                        Last Name

                    </label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-person"></i>

                        </span>

                        <input

                                id="lastName"

                                class="form-control"

                                type="text"

                                placeholder="Last Name"

                                required>

                    </div>

                </div>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Mobile Number

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-phone"></i>

                    </span>

                    <input

                            id="mobile"

                            class="form-control"

                            type="tel"

                            maxlength="10"

                            placeholder="9876543210"

                            required>

                </div>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Email Address

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-envelope"></i>

                    </span>

                    <input

                            id="email"

                            class="form-control"

                            type="email"

                            placeholder="name@example.com"

                            required>

                </div>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Username

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-at"></i>

                    </span>

                    <input

                            id="username"

                            class="form-control"

                            type="text"

                            placeholder="Choose Username"

                            required>

                </div>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Password

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock"></i>

                    </span>

                    <input

                            id="password"

                            class="form-control"

                            type="password"

                            placeholder="Password"

                            required>

                    <button

                            id="togglePassword"

                            type="button"

                            class="btn btn-outline-secondary">

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Confirm Password

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-shield-lock"></i>

                    </span>

                    <input

                            id="confirmPassword"

                            class="form-control"

                            type="password"

                            placeholder="Confirm Password"

                            required>

                    <button

                            id="toggleConfirmPassword"

                            type="button"

                            class="btn btn-outline-secondary">

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>

            <button

                    id="registerButton"

                    type="submit"

                    class="btn btn-primary login-btn">

                <span id="registerText">

                    CREATE ACCOUNT

                </span>

                <span

                        id="registerSpinner"

                        class="spinner-border spinner-border-sm d-none">

                </span>

            </button>

        </form>

        <!-- ===================================================== -->
        <!-- Footer -->
        <!-- ===================================================== -->

        <div class="register-footer">

            <p>

                Already have an account?

                <a href="login.html">

                    Sign In

                </a>

            </p>

        </div>

        <div class="footer">

            <div>

                GarageOS v1.0

            </div>

            <small>

                © 2026 GarageOS Technologies

            </small>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/api.js"></script>

<script src="../js/auth.js"></script>

<script src="register.js"></script>

</body>

</html>
