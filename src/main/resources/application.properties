spring.application.name=garagest-backend

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}


# ============================
# JWT Configuration
# ============================

# REQUIRED: supply SECURITY_JWT_SECRET (at least 32 random bytes) in every environment. There is deliberately no
# default: the application refuses to start without a strong value (see JwtSecretPolicy).
security.jwt.secret=${SECURITY_JWT_SECRET:}
security.jwt.access-token-expiration=1h
security.jwt.refresh-token-expiration=7d

garageos.media.storage-path=uploads

# ============================
# Media Upload Limits
# ============================
# Default Spring Boot multipart limit is 1MB, which rejects real camera
# photos/videos. Sized generously for job-card media (inspection/before/
# during/after-service photos and short videos) while still bounding
# request size against abuse.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

google.drive.application-name=${GOOGLE_DRIVE_APPLICATION_NAME}
google.drive.client-id=${GOOGLE_DRIVE_CLIENT_ID}
google.drive.client-secret=${GOOGLE_DRIVE_CLIENT_SECRET}
google.drive.redirect-uri=${GOOGLE_DRIVE_REDIRECT_URI}
google.drive.root-folder-id=${GOOGLE_DRIVE_ROOT_FOLDER_ID}
google.maps.routes.api-key=${GOOGLE_MAPS_ROUTES_API_KEY}
google.maps.places.api-key=${GOOGLE_MAPS_PLACES_API_KEY:}

# ============================
# Cloudflare R2 (media storage)
# ============================
# All optional (empty default) so the app starts cleanly before R2 is
# provisioned — R2MediaStorageProvider checks these at call time, not at
# startup, and the upload-intent endpoint returns a clear
# MEDIA_STORAGE_NOT_CONFIGURED error naming the missing variable rather than
# failing silently or crashing the application context.
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket-name=${R2_BUCKET_NAME:}
r2.upload-url-ttl-minutes=${R2_UPLOAD_URL_TTL_MINUTES:15}
r2.playback-url-ttl-minutes=${R2_PLAYBACK_URL_TTL_MINUTES:10}

# ============================
# Notifications (FCM push)
# ============================
# Off by default; set NOTIFICATIONS_ENABLED=true and FIREBASE_CREDENTIALS_BASE64
# (base64 of the Firebase service-account JSON) in the environment to enable.
notifications.enabled=${NOTIFICATIONS_ENABLED:false}
notifications.fcm.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}

# ============================
# OTP verification (SMS, India DLT)
# ============================
# Off by default so existing registration behaves exactly as before. To enable:
# OTP_ENABLED=true plus OTP_HASH_SECRET and the OTP_SMS_* values from your SMS
# provider / DLT registration. See GARAGEST_OTP_AND_REPORTS.md. Never commit values.
otp.enabled=${OTP_ENABLED:false}
otp.provider=${OTP_PROVIDER:SMS}
otp.hash-secret=${OTP_HASH_SECRET:}
otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
otp.max-sends-per-hour=${OTP_MAX_SENDS_PER_HOUR:5}
otp.sms.base-url=${OTP_SMS_BASE_URL:https://cpaas.messagecentral.com}
otp.sms.customer-id=${OTP_SMS_CUSTOMER_ID:}
otp.sms.password=${OTP_SMS_PASSWORD:}

# ============================
# E-mail (final Job Card reports)
# ============================
# Off by default. To enable: EMAIL_ENABLED=true, EMAIL_FROM, and the standard Spring mail
# settings via env vars: SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD, SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true,
# SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true. Deliberately NOT declared as
# spring.mail.* here: without SPRING_MAIL_HOST Spring creates no mail sender (and no mail
# health check). Never commit values.
communication.email.enabled=${EMAIL_ENABLED:false}
communication.email.from=${EMAIL_FROM:}
final-report.email.retry-delay-ms=${FINAL_REPORT_EMAIL_RETRY_DELAY_MS:60000}
final-report.email.max-attempts=${FINAL_REPORT_EMAIL_MAX_ATTEMPTS:5}
final-report.email.max-age-days=${FINAL_REPORT_EMAIL_MAX_AGE_DAYS:7}

# ============================
# Garage discovery (customer "find a garage")
# ============================
garage.discovery.default-radius-km=${GARAGE_DISCOVERY_DEFAULT_RADIUS_KM:40}
garage.discovery.max-radius-km=${GARAGE_DISCOVERY_MAX_RADIUS_KM:100}
garage.discovery.max-results=${GARAGE_DISCOVERY_MAX_RESULTS:50}

# ============================
# GST policy (see GARAGEST_DEVELOPER_HANDBOOK.md, Catalog and GST)
# Interim rate for PART/LABOUR lines with no verified classification (flagged CONFIGURED_FALLBACK).
# Blank disables the fallback. require-classification=true blocks invoicing of unclassified lines.
# ============================
garagest.tax.fallback-rate-percent=${GARAGEST_TAX_FALLBACK_RATE_PERCENT:18}
garagest.tax.require-classification=${GARAGEST_TAX_REQUIRE_CLASSIFICATION:false}

# ============================
# Platform administrator bootstrap (DISABLED by default; see handbook 27F)
# Grants SUPER_ADMIN once to an already-registered account. All four values are required while enabled;
# remove them after the grant is logged. Never commit values.
# ============================
garagest.bootstrap.platform-admin.enabled=${GARAGEST_BOOTSTRAP_PLATFORM_ADMIN_ENABLED:false}
garagest.bootstrap.platform-admin.username=${GARAGEST_BOOTSTRAP_PLATFORM_ADMIN_USERNAME:}
garagest.bootstrap.platform-admin.confirm-username=${GARAGEST_BOOTSTRAP_PLATFORM_ADMIN_CONFIRM_USERNAME:}
garagest.bootstrap.platform-admin.environment=${GARAGEST_BOOTSTRAP_PLATFORM_ADMIN_ENVIRONMENT:}

# ============================
# Browser (Flutter Web) origins allowed to call /api/**. Exact origins, comma separated; empty = none.
# Wildcards are ignored. Example for local testing: http://localhost:8081
# ============================
garagest.cors.allowed-origins=${GARAGEST_CORS_ALLOWED_ORIGINS:}
